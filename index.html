<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>

    <main class="portfolio">

        <!-- ==============================
             Intro
        =============================== -->
        <section class="intro">
            <div class="container">

                <span class="intro__label font-en">
                    PORTFOLIO
                </span>

                <h1 class="intro__title">
                    사용자와 서비스의 흐름을 이해하고<br>
                    더 나은 경험을 디자인합니다.
                </h1>

            </div>
        </section>


        <!-- ==============================
             Project List
        =============================== -->
        <section class="portfolio-work">

            <div class="container">

                <div class="portfolio-work__header">

                    <h2 class="portfolio-work__title font-en">
                        Featured Projects
                    </h2>

                </div>


                <div id="workGrid" class="work-grid">

                    <!-- 방과후드림 -->
                    <article class="work-card" data-year="2026" data-order="1">

                        <a
                            href="./projects/dream.html"
                            class="work-card__link"
                        >

                            <div class="work-card__thumbnail">

                                <img
                                    src="./images/dream/thumbnail.jpg"
                                    alt="방과후드림 프로젝트"
                                    class="work-card__image"
                                >

                            </div>

                            <div class="work-card__info">

                                <h3 class="work-card__title">
                                    방과후드림
                                </h3>

                                <p class="work-card__category font-en">
                                    Public Service / Web · Mobile
                                </p>

                            </div>

                        </a>

                    </article>


                    <!-- 핀테크산업협회 -->
                    <article class="work-card" data-year="2026" data-order="2">

                        <a
                            href="./projects/fintech.html"
                            class="work-card__link"
                        >

                            <div class="work-card__thumbnail">

                                <img
                                    src="./images/fintech/thumbnail.jpg"
                                    alt="한국핀테크산업협회"
                                    class="work-card__image"
                                >

                            </div>

                            <div class="work-card__info">

                                <h3 class="work-card__title">
                                    한국핀테크산업협회 홈페이지 리뉴얼
                                </h3>

                                <p class="work-card__category font-en">
                                    Association / Responsive Web
                                </p>

                            </div>

                        </a>

                    </article>

                </div>

            </div>

        </section>

    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p class="footer__copyright">
                © 2026 AHNSOHYUN. All Rights Reserved.
            </p>
        </div>
    </footer>

    
    <!-- ==============================
            script
    =============================== -->
    <script src="./js/common.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
