<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 포트폴리오</title>
  <link rel="stylesheet" href="./css/viewer.css">
</head>

<body>
  <header class="toolbar">
    <div class="toolbar-left"><button id="toggleSidebar" class="icon-btn" aria-label="썸네일 메뉴">☰</button><strong
        id="documentTitle" class="document-title">프로젝트 포트폴리오</strong></div>
    <div class="toolbar-center"><button id="prevPage" class="icon-btn" aria-label="이전 페이지">‹</button><input
        id="pageNumber" type="number" min="1" value="1" aria-label="페이지 번호"><span id="pageCount">/ 0</span><span
        class="separator"></span><button id="zoomOut" class="icon-btn" aria-label="축소">−</button><span
        id="zoomLabel">100%</span><button id="zoomIn" class="icon-btn" aria-label="확대">＋</button><button id="fitWidth"
        class="text-btn" title="너비 맞춤">너비 맞춤</button><button id="fitPage" class="text-btn" title="페이지 맞춤">전체
        맞춤</button><button id="nextPage" class="icon-btn" aria-label="다음 페이지">›</button></div>
    <div class="toolbar-right"><span>PORTFOLIO</span></div>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="페이지 미리보기">
      <div id="thumbnails" class="thumbnails"></div>
    </aside>
    <main id="viewport" class="viewport" tabindex="0">
      <div id="status" class="status">PDF를 불러오는 중입니다.</div>
      <div id="pages" class="pages"></div>
    </main>
  </div>
  <script type="module" src="./js/viewer.js"></script>
</body>

</html>
